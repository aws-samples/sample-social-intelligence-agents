# CI — lint, format, and unit tests.
# Integration tests are excluded because they require live AWS credentials
# (see tests/integration/). Run those separately with real IAM access.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          uv lock --check
          uv sync --extra dev --extra infra --locked

      - name: Verify runtime dependency export
        run: |
          uv export --frozen --format requirements-txt --no-dev --no-emit-project --no-hashes --no-header --no-annotate \
            --output-file /tmp/runtime-requirements.txt
          diff --unified=3 infra/runtime-requirements.txt /tmp/runtime-requirements.txt

      - name: Lint
        run: >
          uv run ruff check
          src/
          entrypoint.py
          scripts/
          tests/
          infra/app.py
          infra/gateway_stack.py
          infra/stacks/
          infra/lambda/handler.py
          demo/config.py

      - name: Format check
        run: >
          uv run ruff format --check
          src/
          entrypoint.py
          scripts/
          tests/
          infra/app.py
          infra/gateway_stack.py
          infra/stacks/
          infra/lambda/handler.py
          demo/config.py

      - name: Unit tests
        run: uv run python -m pytest tests/ -q --ignore=tests/integration

      # Synthesizes the CDK app directly rather than through the cdk CLI, so CI needs no
      # Node toolchain. The account and Region are placeholders: synth is env-agnostic here
      # and no AWS credentials are used or required. CDK_OUTDIR is mandatory — an App with
      # no explicit outdir synthesizes to a temporary directory when the cdk CLI is not
      # driving it, and the gate would then find nothing to check.
      - name: Synth infrastructure
        env:
          CDK_OUTDIR: cdk.out
          CDK_DEFAULT_ACCOUNT: "123456789012"
          AWS_REGION: us-east-1
          JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: "1"
        run: |
          uv run python infra/app.py
          uv run python scripts/check_synth.py cdk.out
