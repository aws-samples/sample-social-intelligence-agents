[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "social-intelligence-agents"
version = "0.1.0"
description = "Multi-agent social intelligence system built with Strands Agents SDK and Amazon Bedrock AgentCore"
readme = "README.md"
license = "MIT-0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "strands-agents==1.48.0",
    "bedrock-agentcore[strands-agents]==1.22.0",
    "boto3>=1.43.31",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "mcp-proxy-for-aws==1.6.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.21",
    # Imported directly by tests/test_schemas.py. Declared rather than relied on as a
    # transitive of the runtime dependencies, so the tests keep working if those drop it.
    "pyyaml==6.0.3",
]
infra = [
    "aws-cdk-lib==2.261.0",
    "constructs==10.6.0",
    "cdk-nag==2.38.2",
    # Floor is a security floor, not a feature floor: pip <26.2 is CVE-2026-13346.
    "pip>=26.2,<27.0",
]
demo = [
    "streamlit==1.54.0",
    "markupsafe==3.0.3",
    "pillow==12.3.0",
    "python-dotenv==1.2.2",
]

[tool.uv]
# Security floors for transitive dependencies. These packages are not imported by
# this project; they arrive via other dependencies that carry no upper bound, so a
# constraint is the correct lever — it raises the resolved version without declaring
# a first-party dependency we do not use. Keep an advisory reference per entry so the
# floor can be retired once the direct dependency's own pin clears it.
constraint-dependencies = [
    # cryptography <50.0.0 (via authlib, pyjwt, secretstorage): GHSA-g6cj-pr64-35w5.
    # Reaches the deployed AgentCore runtime through infra/runtime-requirements.txt.
    "cryptography>=50.0.0",
    # gitpython <=3.1.57 (via streamlit, demo extra only): GHSA-wvpp-8hx9-p66j,
    # GHSA-jm78-9fvv-mhgr, GHSA-hmq2-w58f-27jc, GHSA-9rj7-rf2p-w77r,
    # GHSA-4gmw-gg2m-w46p, GHSA-hh9p-6wh2-4mfc, plus GHSA-3f7w-8rr8-f37f,
    # GHSA-539m-9xh6-q6rr, GHSA-p538-c434-8v24 fixed in earlier 3.1.5x releases.
    "gitpython>=3.1.59",
]

[tool.hatch.build.targets.wheel]
packages = ["src/social_intelligence"]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src"]
exclude = ["infra/lambda/.bundle"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"infra/stacks/*.py" = ["S603", "S607"]  # CDK synth runs pip subprocess with hardcoded args
"tests/**/*.py" = ["S101"]  # assert is fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Latest upstream SDK releases emit these internal deprecations during import.
    # Keep repository and transitive application warnings visible in CI.
    "ignore:Support for class-based `config` is deprecated, use ConfigDict instead.:pydantic.warnings.PydanticDeprecatedSince20:bedrock_agentcore\\.runtime\\.context",
    "ignore:strands\\.experimental\\.hooks\\.multiagent is deprecated\\. Use strands\\.hooks instead\\.:DeprecationWarning:strands\\.experimental\\.hooks\\.multiagent",
]
